<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>EDH Club</title>
  <meta name="description" content="Free Commander games in your browser. Bring your deck, sit at the table, play.">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="theme-color" content="#06080d">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EDH Club">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.scryfall.com">
  <link rel="preconnect" href="https://cards.scryfall.io">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Metamorphous&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/mana-font@1.18.0/css/mana.min.css">
  <link rel="stylesheet" href="/src/style.css">
</head>
<body>
  <div id="app">
    <nav class="rail" aria-label="Main">
      <a class="logo" href="/" title="EDH Club"><span>EDH</span><small>Club</small></a>
      <button type="button" class="rail-btn" id="tableBtn" title="Table: seats, bots and decks"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18"/><circle cx="8" cy="15" r="1.4"/><circle cx="12" cy="15" r="1.4"/><circle cx="16" cy="15" r="1.4"/></svg><span>Table</span></button>
      <button type="button" class="rail-btn" id="importBtn" title="Decks"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="12" height="17" rx="1.5"/><path d="M8 6h6M8 9h6"/><path d="M17 7l3 1v12l-8 1"/></svg><span>Decks</span></button>
      <a class="rail-btn" href="/#clubs" title="Clubs"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3"/><circle cx="16" cy="9" r="2.5"/><path d="M3 19c0-3 3-5 6-5s6 2 6 5M14 18c0-2 2-3.5 4.5-3.5S21 16 21 18"/></svg><span>Clubs</span></a>
      <button type="button" class="rail-btn" id="settingsBtn" title="Settings" aria-haspopup="menu"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg><span>Settings</span></button>
      <div class="rail-sp"></div>
      <button type="button" class="rail-btn" id="newBtn" title="New game"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0113.7-5.7L20 8M20 4v4h-4M20 12a8 8 0 01-13.7 5.7L4 16M4 20v-4h4"/></svg><span>New</span></button>
      <button type="button" class="rail-btn" id="fsBtn" title="Full screen (Shift+F)"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg><span>Full</span></button>
      <button type="button" class="rail-btn" id="sideBtn" title="Log and card preview"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16"/></svg><span>Panel</span></button>
      <label class="rail-seat" for="viewSel" hidden><span>Seat</span><select id="viewSel"></select></label>
    </nav>
    <main class="table" id="table">
      <section class="opps" id="opps" aria-label="Opponents"></section>
      <section class="mid" id="mid" aria-label="Turn"></section>
      <section class="me" id="me" aria-label="Your seat"></section>
    </main>
    <aside class="side" id="side" aria-label="Game log and card preview">
      <div class="side-tabs"><button type="button" class="tab on" data-tab="log">Game log</button><button type="button" class="tab" data-tab="chat">Chat</button><div id="roomBar"></div></div>
      <div class="side-body" id="sideLog"></div>
      <div class="side-body chat" id="sideChat" hidden><div class="chatlist" id="chatList"></div><form class="chatform" id="chatForm" autocomplete="off"><input id="chatInput" maxlength="300" placeholder="Say something to the table…" aria-label="Chat message"><button type="submit" class="btn sm" id="chatSend">Send</button></form></div>
      <div class="side-card" id="sideCard"><div class="side-empty">Point at a card to see it here.</div></div>
      <footer class="fan">EDH Club is unofficial Fan Content permitted under the Fan Content Policy. Not approved/endorsed by Wizards. Portions of the materials used are property of Wizards of the Coast. ©Wizards of the Coast LLC. Card images and data from <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfall</a>.</footer>
    </aside>
    <div class="turn" id="turn" hidden></div>
    <span hidden><select id="motionSel"><option value="full">Full</option><option value="reduced">Reduced</option><option value="off">Off</option></select><button type="button" id="fxBtn"></button><button type="button" id="soundBtn"></button></span>
  </div>
  <canvas id="fx"></canvas>
  <svg id="arrows" aria-hidden="true"></svg>
  <div id="layer"></div>
  <div id="prompt" class="prompt" hidden></div>
  <div id="tapbar" class="tapbar" hidden></div>
  <div id="zoom" hidden></div>
  <div id="menu" class="menu" hidden></div>
  <div id="modal" hidden></div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
